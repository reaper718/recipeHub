
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Recipes | RecipeHub Admin</title>
    <link rel="stylesheet" href="admin-recipes.css">
</head>
<body>
    <header class="topbar">
        <a href="home.html" class="brand">RecipeHub</a>
        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="admin-users.html">Manage Users</a>
            <a href="admin-recipes.html" class="active">Manage Recipes</a>
            <a href="home.html">Recipes</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-heading">
            <div>
                <p class="eyebrow">CONTENT MODERATION</p>
                <h1>Manage Recipes</h1>
                <p>Review recipes published by the RecipeHub community.</p>
            </div>

            <div class="total-card">
                <span>Recipes displayed</span>
                <strong id="recipeCount">—</strong>
            </div>
        </section>

        <section class="toolbar">
            <input
                type="search"
                id="searchInput"
                placeholder="Search by recipe title or category..."
                aria-label="Search recipes"
            >
            <button id="searchBtn" type="button">Search</button>
            <button id="refreshBtn" type="button" class="secondary">Refresh</button>
        </section>

        <p id="pageMessage" role="status" aria-live="polite"></p>

        <section id="recipesGrid" class="recipes-grid">
            <p>Loading recipes...</p>
        </section>

        <p class="back-link">
            <a href="admin.html">← Back to Admin Dashboard</a>
        </p>
    </main>

    <script src="admin-recipes.js"></script>
</body>
</html>
